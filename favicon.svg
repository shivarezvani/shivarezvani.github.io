<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SR">
  <!-- The nav's SR mark: a filled disc with the initials in the inverse.
       The scheme query flips it so the disc never disappears into a dark
       browser chrome, the way a fixed near-black one would. -->
  <style>
    .disc { fill: #111113; }
    .mark { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #f2f2f2; }
      .mark { fill: #0e0e0f; }
    }
  </style>
  <rect class="disc" width="32" height="32" rx="16" />
  <text
    class="mark"
    x="16"
    y="16.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="13.5"
    font-weight="700"
    letter-spacing="0.5"
  >SR</text>
</svg>
