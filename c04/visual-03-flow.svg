<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2664" height="1692" viewBox="0 0 2664 1692">
<rect x="0" y="0" width="2664" height="1692" fill="#FFFFFF"/>
<text x="110" y="116" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#9A7422" xml:space="preserve">VISUAL 03</text>
<text x="110" y="190" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="normal" fill="#545454" xml:space="preserve">Long flows die from uncertainty, not length. Four phases, each with a different kind of demand on the user — and the seams between them designed as deliberately as the screens.</text>
<path d="M 110 238 L 2554 238" stroke="#E6E6E6" stroke-width="2" fill="none" stroke-linecap="square"/>
<rect x="110" y="336" width="588" height="700" rx="12" fill="#FFFFFF" stroke="#9A7422" stroke-width="2"/>
<rect x="110" y="336" width="588" height="104" rx="12" fill="#F1EFE8"/>
<rect x="110" y="414" width="588" height="26" fill="#F1EFE8"/>
<text x="136" y="378" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#9A7422" xml:space="preserve">SETUP</text>
<text x="136" y="409" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#9A7422" xml:space="preserve">You are told what this is</text>
<rect x="136" y="468" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="156" y="504" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Onboarding</text>
<path d="M 404 527 L 404 547" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="404,547 397,536 411,536" fill="#A8A69E"/>
<rect x="136" y="550" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="156" y="586" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Home</text>
<path d="M 404 609 L 404 629" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="404,629 397,618 411,618" fill="#A8A69E"/>
<rect x="136" y="632" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="156" y="668" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Start</text>
<path d="M 404 691 L 404 711" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="404,711 397,700 411,700" fill="#A8A69E"/>
<rect x="136" y="714" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="156" y="750" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Road map</text>
<path d="M 136 900 L 672 900" stroke="#E8E6DF" stroke-width="2" fill="none" stroke-linecap="square"/>
<text x="136" y="940" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#9A7422" xml:space="preserve">Four screens before a single question is asked.</text>
<text x="136" y="970" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#9A7422" xml:space="preserve">Orientation is the point.</text>
<path d="M 702 686 L 724 686" stroke="#A8A69E" stroke-width="4" fill="none" stroke-linecap="square"/>
<polygon points="724,686 713,679 713,693" fill="#A8A69E"/>
<rect x="728" y="336" width="588" height="700" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="2"/>
<rect x="728" y="336" width="588" height="104" rx="12" fill="#EEEDFE"/>
<rect x="728" y="414" width="588" height="26" fill="#EEEDFE"/>
<text x="754" y="378" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#534AB7" xml:space="preserve">YOUR MONEY</text>
<text x="754" y="409" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#534AB7" xml:space="preserve">Facts you already know</text>
<rect x="754" y="468" width="536" height="86" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="774" y="504" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Goal — retirement,</text>
<text x="774" y="534" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">children, travel</text>
<path d="M 1022 557 L 1022 577" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="1022,577 1015,566 1029,566" fill="#A8A69E"/>
<rect x="754" y="580" width="536" height="86" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="774" y="616" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Goal-specific</text>
<text x="774" y="646" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">questions</text>
<path d="M 1022 669 L 1022 689" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="1022,689 1015,678 1029,678" fill="#A8A69E"/>
<rect x="754" y="692" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="774" y="728" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Initial capital</text>
<path d="M 1022 751 L 1022 771" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="1022,771 1015,760 1029,760" fill="#A8A69E"/>
<rect x="754" y="774" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="774" y="810" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Monthly contribution</text>
<path d="M 1022 833 L 1022 853" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="1022,853 1015,842 1029,842" fill="#A8A69E"/>
<rect x="754" y="856" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="774" y="892" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Duration</text>
<path d="M 754 936 L 1290 936" stroke="#E8E6DF" stroke-width="2" fill="none" stroke-linecap="square"/>
<text x="754" y="976" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#534AB7" xml:space="preserve">Three capacity questions: initial capital, monthly</text>
<text x="754" y="1006" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#534AB7" xml:space="preserve">contribution and duration.</text>
<path d="M 1320 686 L 1342 686" stroke="#A8A69E" stroke-width="4" fill="none" stroke-linecap="square"/>
<polygon points="1342,686 1331,679 1331,693" fill="#A8A69E"/>
<rect x="1346" y="336" width="588" height="700" rx="12" fill="#FFFFFF" stroke="#993C1D" stroke-width="2"/>
<rect x="1346" y="336" width="588" height="104" rx="12" fill="#FAECE7"/>
<rect x="1346" y="414" width="588" height="26" fill="#FAECE7"/>
<text x="1372" y="378" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#993C1D" xml:space="preserve">MEASUREMENT</text>
<text x="1372" y="409" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#993C1D" xml:space="preserve">Behaviour, not self-report</text>
<rect x="1372" y="468" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="1392" y="504" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Risk intro</text>
<path d="M 1640 527 L 1640 547" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="1640,547 1633,536 1647,536" fill="#A8A69E"/>
<rect x="1372" y="550" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="1392" y="586" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Five risk questions</text>
<path d="M 1640 609 L 1640 629" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="1640,629 1633,618 1647,618" fill="#A8A69E"/>
<rect x="1372" y="632" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="1392" y="668" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Risk profile</text>
<path d="M 1372 900 L 1908 900" stroke="#E8E6DF" stroke-width="2" fill="none" stroke-linecap="square"/>
<text x="1372" y="940" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#993C1D" xml:space="preserve">No branching: the same five questions for every user,</text>
<text x="1372" y="970" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#993C1D" xml:space="preserve">and no way back to a previous one.</text>
<path d="M 1938 686 L 1960 686" stroke="#A8A69E" stroke-width="4" fill="none" stroke-linecap="square"/>
<polygon points="1960,686 1949,679 1949,693" fill="#A8A69E"/>
<rect x="1964" y="336" width="588" height="700" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/>
<rect x="1964" y="336" width="588" height="104" rx="12" fill="#E1F5EE"/>
<rect x="1964" y="414" width="588" height="26" fill="#E1F5EE"/>
<text x="1990" y="378" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0F6E56" xml:space="preserve">RESULTS</text>
<text x="1990" y="409" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F6E56" xml:space="preserve">An answer you can act on</text>
<rect x="1990" y="468" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="2010" y="504" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Prediction loading</text>
<path d="M 2258 527 L 2258 547" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="2258,547 2251,536 2265,536" fill="#A8A69E"/>
<rect x="1990" y="550" width="536" height="86" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="2010" y="586" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Capital growth</text>
<text x="2010" y="616" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">projection</text>
<path d="M 2258 639 L 2258 659" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="2258,659 2251,648 2265,648" fill="#A8A69E"/>
<rect x="1990" y="662" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="2010" y="698" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Asset allocation</text>
<path d="M 2258 721 L 2258 741" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="2258,741 2251,730 2265,730" fill="#A8A69E"/>
<rect x="1990" y="744" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="2010" y="780" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Fund comparison</text>
<path d="M 2258 803 L 2258 823" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="2258,823 2251,812 2265,812" fill="#A8A69E"/>
<rect x="1990" y="826" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="2010" y="862" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Fund details</text>
<path d="M 2258 885 L 2258 905" stroke="#A8A69E" stroke-width="3" fill="none" stroke-linecap="square"/>
<polygon points="2258,905 2251,894 2265,894" fill="#A8A69E"/>
<rect x="1990" y="908" width="536" height="56" rx="8" fill="#F1EFE8" stroke="#C8C6BE" stroke-width="2"/>
<text x="2010" y="944" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1A1917" xml:space="preserve">Goal account opened</text>
<path d="M 1990 978 L 2526 978" stroke="#E8E6DF" stroke-width="2" fill="none" stroke-linecap="square"/>
<text x="1990" y="1006" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F6E56" xml:space="preserve">Not a verdict — a plan the user can open a goal account</text>
<text x="1990" y="1030" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F6E56" xml:space="preserve">against.</text>
<rect x="110" y="1086" width="794" height="230" rx="10" fill="#FFFFFF" stroke="#DFDDD5" stroke-width="2"/>
<rect x="110" y="1086" width="5" height="230" fill="#9A7422"/>
<text x="140" y="1138" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1A1917" xml:space="preserve">A road map before the journey</text>
<text x="140" y="1180" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">Users abandon when they can't tell how much is left. Laying out the stages</text>
<text x="140" y="1211" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">before the first question costs one screen; every screen after it then reads</text>
<text x="140" y="1242" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">as progress rather than another demand.</text>
<rect x="934" y="1086" width="794" height="230" rx="10" fill="#FFFFFF" stroke="#DFDDD5" stroke-width="2"/>
<rect x="934" y="1086" width="5" height="230" fill="#534AB7"/>
<text x="964" y="1138" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1A1917" xml:space="preserve">Passages between phases</text>
<text x="964" y="1180" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">The flow has distinct modes — answering about your money, being</text>
<text x="964" y="1211" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">measured, receiving results. Short transition screens sit between them, so</text>
<text x="964" y="1242" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">the user knows the task has changed instead of discovering it</text>
<text x="964" y="1273" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">mid-question.</text>
<rect x="1758" y="1086" width="794" height="230" rx="10" fill="#FFFFFF" stroke="#DFDDD5" stroke-width="2"/>
<rect x="1758" y="1086" width="5" height="230" fill="#0F6E56"/>
<text x="1788" y="1138" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1A1917" xml:space="preserve">A designed wait</text>
<text x="1788" y="1180" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">The projection is preceded by a loading state. Not a technical necessity —</text>
<text x="1788" y="1211" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">honest pacing. A personalised projection that materialises in 200 ms reads</text>
<text x="1788" y="1242" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E6C66" xml:space="preserve">as a lookup; one that visibly computes reads as work done on your behalf.</text>
<path d="M 110 1356 L 2554 1356" stroke="#DFDDD5" stroke-width="2" fill="none" stroke-linecap="square"/>
<text x="110" y="1431" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1A1917" xml:space="preserve">Goal first, because that's the user's unit.</text>
<text x="110" y="1482" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="normal" fill="#545454" xml:space="preserve">The goal governs what follows — a travel plan asks where and for how long; a retirement plan doesn't. Three questions stay constant: initial capital, monthly contribution and duration.</text>
<text x="110" y="1524" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="normal" fill="#545454" xml:space="preserve">Those are capacity questions, not psychology questions — facts and intentions the user can state without introspection. Duration supplies the time horizon directly, so nobody had to be asked</text>
<text x="110" y="1566" font-family="Arial, 'Liberation Sans', 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="normal" fill="#545454" xml:space="preserve">“what is your investment horizon,” a question that reliably produces a shrug.</text>
</svg>
